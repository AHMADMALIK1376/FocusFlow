<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#E86562" />
  <!-- The student's colour theme, applied before anything paints (the same script as index.html;
       a test keeps the two identical). Then: with another brand colour, the app icon is swapped for a brand tile. -->
  <script id="ff-theme-boot">
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('focusflow:theme.colors') || 'null');
          if (!c || c.v !== 4 || !c.tokens || typeof c.tokens !== 'object') return;
          var name = /^--[a-z0-9-]+$/, safe = /^[0-9a-z .,%()\/#-]+$/i, fn = /([a-z-]+)\(/gi;
          var ok = /^(rgb|linear-gradient|var)$/, keys = [], k, v, f;
          for (k in c.tokens) {
            v = c.tokens[k];
            if (!name.test(k) || typeof v !== 'string' || !safe.test(v)) return;
            fn.lastIndex = 0; // only the CSS functions a theme uses (no url(, image-set(, ...)
            while ((f = fn.exec(v))) if (!ok.test(f[1])) return;
            keys.push(k);
          }
          var root = document.documentElement;
          for (var i = 0; i < keys.length; i++) root.style.setProperty(keys[i], c.tokens[keys[i]]);
          if (c.scheme === 'light' || c.scheme === 'dark') root.style.setProperty('color-scheme', c.scheme);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && /^#[0-9a-fA-F]{6}$/.test(c.meta)) m.setAttribute('content', c.meta);
        } catch (e) { /* unreadable: the built-in colours stay */ }
      })();
    </script>
  <script>
    (function () { try { var r = document.documentElement, b = r.style.getPropertyValue('--brand').trim(); if (b && b !== '236 112 109') r.classList.add('ff-themed'); } catch (e) {} })();
  </script>
  <title>FocusFlow · You're offline</title>
  <!-- Served by sw.js when a page can't be loaded at all (no internet, or
       the site is unreachable). Self-contained: the React app can't load here. -->
  <style>
    :root { --canvas: 245 239 230; --surface: 255 253 249; --surface-2: 250 244 235; --brand: 236 112 109; --on-brand: 255 255 255;
      --sage-deep: 108 178 136; --ink: 52 46 62; --muted: 128 116 108; --shadow-color: 190 160 122; --shade: 214 192 162; --highlight: 255 255 255;
      --grad-hero: linear-gradient(160deg, rgb(245 140 137), rgb(var(--brand))); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 16px; background: rgb(var(--canvas)); color: rgb(var(--ink)); text-align: center;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; font-weight: 900; font-size: 18px; }
    .brand img.app { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 6px 14px rgb(var(--shadow-color) / .35); }
    .tile { display: none; width: 40px; height: 40px; border-radius: 12px; background: var(--grad-hero); place-items: center; box-shadow: 0 6px 14px rgb(var(--shadow-color) / .35); }
    .tile img { width: 85%; height: 85%; object-fit: contain; }
    .ff-themed .brand img.app { display: none; }
    .ff-themed .tile { display: grid; }
    .dial { position: relative; width: 150px; height: 150px; margin-bottom: 32px; }
    .groove { position: absolute; inset: 22px; border-radius: 50%; background: rgb(var(--surface-2));
      box-shadow: inset 0 4px 8px rgb(var(--shade) / .35), inset 0 -2px 4px rgb(var(--highlight) / .9); }
    .disc { position: absolute; inset: 36px; border-radius: 50%; background: rgb(var(--surface)); display: grid; place-items: center;
      box-shadow: 0 6px 12px rgb(var(--shadow-color) / .3), inset 0 3px 5px rgb(var(--highlight) / .9); color: rgb(var(--sage-deep)); }
    svg.ticks { position: absolute; inset: 0; }
    .ticks line { stroke: rgb(var(--ink) / .16); }
    .ticks line.t0 { stroke: rgb(var(--sage-deep)); }
    h1 { margin: 0; font-size: 28px; font-weight: 900; }
    p { margin: 8px auto 0; max-width: 420px; color: rgb(var(--muted)); font-size: 15px; line-height: 1.5; }
    button { margin-top: 28px; padding: 12px 24px; border: 0; border-radius: 16px; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px;
      color: rgb(var(--on-brand)); background: var(--grad-hero); box-shadow: 0 10px 20px rgb(var(--brand) / .35); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="brand"><img class="app" src="/logo192.png" alt="" /><span class="tile"><img src="/logo/focusflow-mark.png" alt="" /></span>FocusFlow</div>

  <div class="dial" role="img" aria-label="Offline">
    <svg class="ticks" viewBox="0 0 150 150" id="ticks"></svg>
    <div class="groove"></div>
    <div class="disc">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" />
      </svg>
    </div>
  </div>

  <h1>You're offline</h1>
  <p>Check your Wi-Fi or mobile data. FocusFlow opens again as soon as you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>

  <script>
    // The same 60-tick ring as the app's dials.
    (function () {
      var svg = document.getElementById('ticks'), out = '';
      for (var i = 0; i < 60; i++) {
        var t = i / 60 * 2 * Math.PI, major = i % 5 === 0, r2 = 74, r1 = major ? 64 : 68;
        out += '<line x1="' + (75 + r1 * Math.sin(t)) + '" y1="' + (75 - r1 * Math.cos(t)) + '" x2="' + (75 + r2 * Math.sin(t)) +
          '" y2="' + (75 - r2 * Math.cos(t)) + '" class="' + (i === 0 ? 't t0' : 't') +
          '" stroke-width="' + (major ? 1.8 : 1) + '" stroke-linecap="round" />';
      }
      svg.innerHTML = out;
    })();
    // Back online: load the page they wanted.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
